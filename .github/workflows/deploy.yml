name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare static files
        run: |
          if [ -f public_html/index.htm ]; then
            cp -f public_html/index.htm public_html/index.html
          fi
          if [ -f public_html/404.shtml ] && [ ! -f public_html/404.html ]; then
            cp -f public_html/404.shtml public_html/404.html
          fi
          touch public_html/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public_html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
